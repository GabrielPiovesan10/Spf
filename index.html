<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DJ | Custom Playlist Generator</title>
    <style>
        body { background: #0b0c10; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1f2833; width: 90%; max-width: 400px; padding: 30px; border-radius: 16px; text-align: center; }
        textarea { width: 100%; height: 100px; background: #000; border: 1px solid #00ff96; border-radius: 8px; color: #fff; padding: 10px; margin: 20px 0; outline: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; background: #1DB954; color: #fff; margin-bottom: 10px; }
        .btn-gen { background: #00ff96; color: #000; display: none; }
        #status-msg { font-size: 12px; color: #00ff96; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI CONTEXT DJ ⚡</h1>
        <button id="auth-btn">Conectar com o Spotify</button>
        <div id="app-area">
            <textarea id="context-input" placeholder="Ex: Churrasco, rock clássico, energia alta"></textarea>
            <button id="generate-btn" class="btn-gen">Gerar Playlist ⚡</button>
        </div>
        <div id="status-msg"></div>
    </div>

    <script>
        const CLIENT_ID = '0ecbe0f675ba49f39a2b94d6ccd906ce';
        const AI_API_KEY = 'AIzaSyCFdTwFvpRhwOkC6rr4qX8p9QSvjhyC6tE';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        async function checkAuth() {
            const code = new URLSearchParams(window.location.search).get('code');
            if (code) {
                const verifier = localStorage.getItem('verifier');
                const res = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: verifier })
                });
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                document.getElementById('auth-btn').style.display = 'none';
                document.getElementById('generate-btn').style.display = 'block';
                document.getElementById('status-msg').innerText = '✅ Conectado!';
            }
        }

        document.getElementById('auth-btn').onclick = async () => {
            const verifier = Math.random().toString(36).substring(2);
            localStorage.setItem('verifier', verifier);
            const challenge = btoa(verifier).replace(/=/g, '');
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=playlist-modify-public playlist-modify-private&code_challenge_method=S256&code_challenge=${challenge}`;
        };

        document.getElementById('generate-btn').onclick = async () => {
            const msg = document.getElementById('status-msg');
            const token = localStorage.getItem('token');
            const input = document.getElementById('context-input').value;
            
            msg.innerText = '🤖 IA processando...';
            const aiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${AI_API_KEY}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Analise: "${input}". Retorne APENAS um JSON: {"genres": ["rock"], "energy": 0.8, "name": "Vibe"}` }] }] })
            });
            const aiJson = JSON.parse((await aiRes.json()).candidates[0].content.parts[0].text.replace(/```json|```/g, ''));
            
            msg.innerText = '🎵 Criando playlist...';
            const me = await (await fetch('https://api.spotify.com/v1/me', { headers: { 'Authorization': 'Bearer ' + token } })).json();
            const playlist = await (await fetch(`https://api.spotify.com/v1/users/${me.id}/playlists`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ name: aiJson.name })
            })).json();
            
            const tracks = await (await fetch(`https://api.spotify.com/v1/recommendations?seed_genres=${aiJson.genres.join(',')}&target_energy=${aiJson.energy}`, { headers: { 'Authorization': 'Bearer ' + token } })).json();
            await fetch(`https://api.spotify.com/v1/playlists/${playlist.id}/tracks`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ uris: tracks.tracks.map(t => t.uri) })
            });
            
            msg.innerText = '🚀 Sucesso! Abrindo...';
            window.location.href = `spotify:playlist:${playlist.id}`;
        };
        checkAuth();
    </script>
</body>
</html>
