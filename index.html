<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AI DJ | Custom Playlist</title>
    <style>
        body { background: #0b0c10; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #1f2833; width: 100%; max-width: 400px; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid #00ff96; }
        textarea { width: 100%; height: 100px; background: #000; border: 1px solid #45f3ff; border-radius: 8px; color: #fff; padding: 10px; margin: 20px 0; outline: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; background: #1DB954; color: #fff; margin-bottom: 10px; }
        .btn-gen { background: #00ff96; color: #000; display: none; }
        #status-msg { font-size: 12px; color: #ffeb3b; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI CONTEXT DJ ⚡</h1>
        <button id="auth-btn">Conectar com o Spotify</button>
        <textarea id="context-input" placeholder="Ex: Rock, Clássicos, Sertanejo..."></textarea>
        <button id="generate-btn" class="btn-gen">Gerar Playlist ⚡</button>
        <div id="status-msg"></div>
    </div>

    <script>
        const CLIENT_ID = '0ecbe0f675ba49f39a2b94d6ccd906ce';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        document.getElementById('generate-btn').onclick = async () => {
            const msg = document.getElementById('status-msg');
            const token = localStorage.getItem('token');
            const input = document.getElementById('context-input').value;
            
            try {
                msg.innerText = '🎵 Criando playlist...';
                const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
                
                // 1. Pega ID do usuário
                const me = await (await fetch('https://api.spotify.com/v1/me', { headers })).json();
                
                // 2. Cria Playlist
                const pl = await (await fetch(`https://api.spotify.com/v1/users/${me.id}/playlists`, {
                    method: 'POST', headers,
                    body: JSON.stringify({ name: "Vibe: " + input, public: true })
                })).json();
                
                // 3. Busca Músicas
                const search = await (await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(input)}&type=track&limit=12`, { headers })).json();
                const uris = search.tracks.items.map(t => t.uri);
                
                // 4. Adiciona Músicas
                await fetch(`https://api.spotify.com/v1/playlists/${pl.id}/tracks`, {
                    method: 'POST', headers,
                    body: JSON.stringify({ uris: uris })
                });
                
                window.location.href = `spotify:playlist:${pl.id}`;
            } catch (err) { msg.innerText = '❌ Erro! Confira o Redirect URI no Spotify Dashboard.'; }
        };

        // Auth
        const code = new URLSearchParams(window.location.search).get('code');
        if (code) {
            fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: localStorage.getItem('verifier') })
            }).then(r => r.json()).then(d => {
                localStorage.setItem('token', d.access_token);
                document.getElementById('auth-btn').style.display = 'none';
                document.getElementById('generate-btn').style.display = 'block';
            });
        }

        document.getElementById('auth-btn').onclick = () => {
            const v = Math.random().toString(36).substring(2);
            localStorage.setItem('verifier', v);
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=playlist-modify-public&code_challenge_method=S256&code_challenge=${btoa(v).replace(/=/g, '')}`;
        };
    </script>
</body>
</html>
