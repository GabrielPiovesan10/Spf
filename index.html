<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DJ | Custom Playlist Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1f2833; width: 100%; max-width: 450px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(0, 255, 150, 0.1); text-align: center; }
        h1 { font-size: 24px; margin-bottom: 10px; color: #00ff96; font-weight: 800; letter-spacing: -0.5px; }
        p { color: #85929E; font-size: 14px; margin-bottom: 25px; }
        textarea { width: 100%; height: 100px; background: #0b0c10; border: 1px solid #45f3ff; border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; resize: none; margin-bottom: 20px; outline: none; }
        textarea:focus { border-color: #00ff96; box-shadow: 0 0 10px rgba(0, 255, 150, 0.2); }
        button { width: 100%; padding: 14px; border: none; border-radius: 25px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s ease; margin-bottom: 12px; }
        .btn-spotify { background: #1DB954; color: #fff; }
        .btn-spotify:hover { background: #1ed760; transform: translateY(-2px); }
        .btn-generate { background: #00ff96; color: #000; display: none; }
        .btn-generate:hover { background: #33ffaa; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,150,0.3); }
        .status { font-size: 13px; color: #00ff96; margin-top: 15px; font-family: monospace; min-height: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI CONTEXT DJ ⚡</h1>
        <p>Digite o que você está fazendo ou seu humor atual e a inteligência artificial criará a playlist perfeita direto no seu Spotify.</p>
        
        <button id="auth-btn" class="btn-spotify">Conectar com o Spotify</button>

        <div id="app-area">
            <textarea id="context-input" placeholder="Ex: Tô na garagem dando um talento na moto no domingão, manda um rock pesado clássico pra animar..."></textarea>
            <button id="generate-btn" class="btn-generate">Gerar Playlist no App ⚡</button>
        </div>

        <div id="status-msg" class="status"></div>
    </div>

    <script>
        // CONFIGURAÇÕES DO SEU APP
        const SPOTIFY_CLIENT_ID = '0ecbe0f675ba49f39a2b94d6ccd906ce';
        const AI_API_KEY = 'AIzaSyCFdTwFvpRhwOkC6rr4qX8p9QSvjhyC6tE'; 
        
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const SCOPES = 'playlist-modify-public playlist-modify-private user-read-private';
        
        let token = null;

        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return Array.from(values, x => possible[x % possible.length]).join('');
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return crypto.subtle.digest('SHA-256', data);
        }

        function base64urlencode(a) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(a)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function checkAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                showStatus('⚡ Trocando código de segurança...');
                const codeVerifier = window.localStorage.getItem('code_verifier');
                const TOKEN_URL = 'https://accounts.spotify.com/api/token';

                try {
                    const response = await fetch(TOKEN_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            client_id: SPOTIFY_CLIENT_ID,
                            grant_type: 'authorization_code',
                            code: code,
                            redirect_uri: REDIRECT_URI,
                            code_verifier: codeVerifier
                        })
                    });

                    const data = await response.json();
                    token = data.access_token;

                    if (token) {
                        document.getElementById('auth-btn').style.display = 'none';
                        document.getElementById('generate-btn').style.display = 'block';
                        showStatus('🟢 Spotify conectado!');
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (err) {
                    showStatus('❌ Falha na conexão.');
                }
            }
        }

        document.getElementById('auth-btn').addEventListener('click', async () => {
            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64urlencode(hashed);
            window.localStorage.setItem('code_verifier', codeVerifier);

            const AUTH_URL = 'https://accounts.spotify.com/authorize';
            const params = new URLSearchParams({
                client_id: SPOTIFY_CLIENT_ID,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                scope: SCOPES
            });
            window.location.href = `${AUTH_URL}?${params.toString()}`;
        });

        function showStatus(msg) {
            document.getElementById('status-msg').innerText = msg;
        }

        document.getElementById('generate-btn').addEventListener('click', async () => {
            const userInput = document.getElementById('context-input').value.trim();
            if (!userInput) return showStatus('Digite alguma vibe antes!');

            try {
                showStatus('🤖 IA interpretando...');
                const AI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + AI_API_KEY;
                const aiResponse = await fetch(AI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Analise o contexto: "${userInput}". Me devolva estritamente um objeto JSON com: "genres" (array ex: rock, pop), "energy" (0.0 a 1.0) e "name" (nome da playlist). Responda apenas o objeto bruto.` }] }] })
                });

                const aiData = await aiResponse.json();
                const configAI = JSON.parse(aiData.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim());

                showStatus('🎵 Buscando músicas...');
                const API_BASE = 'https://api.spotify.com/v1';
                const trackReq = await fetch(`${API_BASE}/recommendations?seed_genres=${configAI.genres.join(',')}&target_energy=${configAI.energy}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const trackData = await trackReq.json();
                const trackUris = trackData.tracks.map(t => t.uri);

                showStatus('📂 Criando playlist...');
                const userReq = await fetch(`${API_BASE}/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                const userData = await userReq.json();

                const playlistReq = await fetch(`${API_BASE}/users/${userData.id}/playlists`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: configAI.name, public: true })
                });
                const playlistData = await playlistReq.json();

                await fetch(`${API_BASE}/playlists/${playlistData.id}/tracks`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uris: trackUris })
                });

                showStatus('🚀 Abrindo Spotify!');
                setTimeout(() => { window.location.href = `spotify:playlist:${playlistData.id}`; }, 500);

            } catch (err) {
                showStatus('❌ Erro no processamento.');
            }
        });

        window.onload = checkAuth;
    </script>
</body>
</html>
